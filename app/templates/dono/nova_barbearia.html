{% extends "base.html" %}
{% block titulo %}Nova barbearia{% endblock %}
{% block head %}{% include "_leaflet.html" %}{% endblock %}
{% block conteudo %}
<h2>Cadastrar barbearia</h2>
<form method="post" action="{{ url_for('dono.cadastrar_barbearia') }}">
  <div class="grid">
    <label>Nome <input name="nome" required></label>
    <label>Bairro <input name="bairro" required placeholder="Botafogo"></label>
  </div>
  <label>Endereço <input name="endereco" required></label>
  <label>Localização: clique no mapa
    <div class="mapa" data-mapa-seletor data-lat="#latitude" data-lng="#longitude"></div>
  </label>
  <div class="grid">
    <label>Latitude <input id="latitude" name="latitude" required readonly></label>
    <label>Longitude <input id="longitude" name="longitude" required readonly></label>
    <label>Cadeiras <input name="quantidade_de_cadeiras" type="number" min="1" max="30" value="1" required></label>
  </div>
  <label>Regras da casa <textarea name="regras" rows="3" placeholder="Ex.: chegar 10 min antes, sem som alto"></textarea></label>
  <button type="submit">Cadastrar</button>
</form>
{% endblock %}
