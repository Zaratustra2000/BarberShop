{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<article class="estreito">
  <h2>Entrar</h2>
  {% if cadastrado %}<p class="aviso aviso-ok">Conta criada. Agora é só entrar.</p>{% endif %}
  <form method="post">
    <label>E-mail <input name="email" type="email" required></label>
    <label>Senha <input name="senha" type="password" required></label>
    <button type="submit">Entrar</button>
  </form>
</article>
{% endblock %}
