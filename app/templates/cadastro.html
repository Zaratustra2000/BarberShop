{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<article class="estreito">
  <h2>Criar conta</h2>
  <form method="post">
    <label>Nome <input name="nome" required></label>
    <label>E-mail <input name="email" type="email" required></label>
    <label>Senha <input name="senha" type="password" minlength="6" required></label>
    <fieldset>
      <legend>Eu sou</legend>
      <label><input type="radio" name="papel" value="dono" required> Dono de barbearia</label>
      <label><input type="radio" name="papel" value="barbeiro"> Barbeiro</label>
      <label><input type="radio" name="papel" value="cliente"> Cliente</label>
    </fieldset>
    <button type="submit">Criar conta</button>
  </form>
</article>
{% endblock %}
